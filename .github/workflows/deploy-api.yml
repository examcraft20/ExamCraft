# Deploy API to Container Registry and Cloud Platform
#
# Required GitHub Secrets:
#   - GITHUB_TOKEN          (auto-provided by GitHub Actions)
#
# For Railway deployment:
#   - RAILWAY_TOKEN         (secret)
#   - DEPLOY_TARGET         (variable: set to 'railway')
#
# For Cloud Run deployment:
#   - GCP_REGION            (variable, defaults to 'us-central1')
#   - DEPLOY_TARGET         (variable: set to 'cloudrun')
#   - Workload Identity Federation must be configured
#     (google-github-actions/auth setup required for GCP authentication)

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Railway
        if: vars.DEPLOY_TARGET == 'railway'
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: examcraft-api

      - name: Deploy to Cloud Run
        if: vars.DEPLOY_TARGET == 'cloudrun'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: examcraft-api
          image: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}

      - name: Deploy notification
        if: always()
        run: echo "Deployment target '${{ vars.DEPLOY_TARGET }}' completed with status '${{ job.status }}'"
